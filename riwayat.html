<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XORA - Riwayat Transaksi</title>
    <link rel="stylesheet" href="css/riwayat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <main class="riwayat-container">
        <header class="riwayat-header">
            <button class="kembali-btn" id="backBtn">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1>Riwayat Transaksi</h1>
        </header>

        <section class="riwayat-list" id="riwayatList">
            <!-- diisi otomatis lewat JS -->
        </section>

        <p class="riwayat-kosong" id="riwayatKosong" style="display:none;">
            Belum ada riwayat transaksi.
        </p>

        <!-- POPUP DETAIL PEMBELIAN -->
        <div class="popup-overlay" id="detailPopup">
            <div class="popup-box">
                <button class="popup-close" id="closeDetailPopup">&times;</button>
                <h3 id="detailJudulFilm"></h3>
                <div class="detail-ringkasan">
                    <p><span>No. Pembelian</span><strong id="detailNoPembelian"></strong></p>
                    <p><span>Lokasi</span><strong id="detailLokasi"></strong></p>
                    <p><span>Bioskop</span><strong id="detailBioskop"></strong></p>
                    <p><span>Studio</span><strong id="detailStudio"></strong></p>
                    <p><span>No. Kursi</span><strong id="detailKursi"></strong></p>
                    <p><span>Tanggal</span><strong id="detailTanggal"></strong></p>
                    <p><span>Jam</span><strong id="detailJam"></strong></p>
                    <p><span>Jumlah Tiket</span><strong id="detailJumlahTiket"></strong></p>
                </div>
                <hr>
                <div class="detail-ringkasan">
                    <p><span>Harga Tiket</span><strong id="detailHargaTiket"></strong></p>
                    <p><span>Biaya Admin</span><strong id="detailAdmin"></strong></p>
                    <p><span>Metode Pembayaran</span><strong id="detailMetode"></strong></p>
                </div>
                <hr>
                <p class="detail-total"><span>Total Bayar</span><strong id="detailTotalBayar"></strong></p>
            </div>
        </div>
        
        <!-- POPUP TAMBAH ULASAN -->
        <div class="popup-overlay" id="ulasanPopup">
            <div class="popup-box">
                <button class="popup-close" id="closeUlasanPopup">&times;</button>
                <h3>Tulis Ulasan Anda</h3>

                <div class="star-rating" id="starRating">
                    <i class="fa-solid fa-star" data-value="1"></i>
                    <i class="fa-solid fa-star" data-value="2"></i>
                    <i class="fa-solid fa-star" data-value="3"></i>
                    <i class="fa-solid fa-star" data-value="4"></i>
                    <i class="fa-solid fa-star" data-value="5"></i>
                </div>

                <textarea
                    id="ulasanText"
                    class="ulasan-textarea"
                    placeholder="Ceritakan pengalamanmu nonton film ini..."
                    rows="4"></textarea>

                <button class="btn-kirim-ulasan" id="btnKirimUlasan">Kirim</button>
            </div>
        </div>

    </main>
    <script src="js/riwayat.js"></script>
</body>
</html>
