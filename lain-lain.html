<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XORA - Drink & Snack / Promo & Voucher</title>
    <link rel="stylesheet" href="css/lain-lain.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <main class="lain-container">
        <header class="lain-header">
            <button class="kembali-btn" id="backBtn">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1 id="judulHalaman"></h1>
        </header>

        <div class="filter-row" id="filterRow">
            <!-- diisi otomatis lewat js/lain-lain.js, tergantung type di URL -->
        </div>

        <section class="lain-grid" id="lainGrid">
            <!--
                Diisi otomatis lewat js/lain-lain.js.
                1 halaman ini nampilin 2 hal beda (Drink & Snack,
                atau Promo & Voucher) tergantung parameter ?type=
                di URL, biar gak perlu 2 file HTML terpisah untuk
                konten yang sifatnya sama-sama pelengkap.
            -->
        </section>
    </main>

    <script src="js/data-lain-lain.js"></script>
    <script src="js/lain-lain.js"></script>
</body>
</html>
