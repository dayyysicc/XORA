<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XORA</title>

    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main class="landing-container">

        <!-- hero -->
        <section class="hero">

            <!-- logo -->
            <img class="logo" src="images/logo.png" alt="Logo XORA">

            <!-- tombol -->
            <div class="menu">
                <a class="btn btn-login" href="login.html">LOGIN</a>
                <a class="btn btn-register" href="registrasi.html">REGISTRASI</a>
            </div>

        </section>

        <!-- poster -->
        <section class="landing-slider">

            <div class="slider-poster">
                <img src="images/poster 1.png" alt="Poster 1" class="poster">
                <img src="images/poster 2.png" alt="Poster 2" class="poster">
                <img src="images/poster 3.png" alt="Poster 3" class="poster">
            </div>

        </section>

        <!-- social media -->
        <section class="social-media">
            <a href="https://www.instagram.com" target="_blank">
                <i class="fa-brands fa-instagram"></i>
            </a>

            <a href="https://www.facebook.com" target="_blank">
                <i class="fa-brands fa-facebook"></i>
            </a>

            <a href="https://twitter.com" target="_blank">
                <i class="fa-brands fa-twitter"></i>
            </a>

            <a href="https://www.youtube.com" target="_blank">
                <i class="fa-brands fa-youtube"></i>
            </a>
        </section>

        <!-- footer -->
        <footer class="footer">
            <p>XORA: Explore Your Cinema</p>
            <p>V1.0 &copy; 2026</p>
        </footer>

    </main>
    <script src="js/index.js"></script>
</body>
</html>
