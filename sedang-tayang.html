<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XORA - Sedang Tayang</title>
    <link rel="stylesheet" href="css/sedang-tayang.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <main class="tayang-container">
        <header class="tayang-header">
            <button class="kembali-btn" id="backBtn">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1>Sedang Tayang</h1>
        </header>

        <div class="filter-row">
            <button class="filter-btn active" id="filterSemua">Semua</button>

            <div class="filter-dropdown">
                    <button class="filter-btn" id="genreBtn">
                        Genre <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="filter-menu" id="genreMenu">
                        <!-- diisi otomatis lewat js/sedang-tayang.js, dari genre yang ada di movies.js -->
                    </div>
                </div>

                <div class="filter-dropdown">
                    <button class="filter-btn" id="ratingBtn">
                        Rating <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="filter-menu" id="ratingMenu">
                        <!-- diisi otomatis lewat js/sedang-tayang.js -->
                    </div>
                </div>
            </div>
        </div>

        <section class="film-list" id="filmList">
            <!--
                Diisi otomatis lewat js/sedang-tayang.js.
                Data diambil langsung dari js/movies.js
                (sumber yang sama dengan Rekomendasi di beranda),
                bukan ditulis ulang manual di sini.
            -->
        </section>
    </main>

    <script src="js/movies.js"></script>
    <script src="js/sedang-tayang.js"></script>
</body>
</html>
